  <!-- Scatter of loose grain in front -->
  <circle cx="15" cy="51" r="1.1" fill="currentColor" stroke="none"/>
  <circle cx="21" cy="53" r="1.1" fill="currentColor" stroke="none"/>
  <circle cx="28" cy="50" r="1.1" fill="currentColor" stroke="none"/>
  <circle cx="35" cy="52" r="1.1" fill="currentColor" stroke="none"/>
  <circle cx="42" cy="51" r="1.1" fill="currentColor" stroke="none"/>
</svg>
