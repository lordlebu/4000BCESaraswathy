<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>South of Tethys: Jambhudweepa Adventure</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <h1>South of Tethys</h1>
      <p>A cozy Jambhudweepa travel prototype: generate a map, wander with arrow keys or WASD, and record a landmark.</p>
      <section class="controls" aria-label="Map controls">
        <label for="seed">Journey seed</label>
        <input id="seed" value="jambhudweepa-evening" aria-label="Journey seed">
        <button id="new-map" type="button">Generate map</button>
        <span>Move with <strong>WASD</strong> or <strong>arrow keys</strong>.</span>
      </section>
    </header>
    <main class="layout">
      <canvas id="world" width="792" height="528" aria-label="Generated Jambhudweepa world map"></canvas>
      <aside>
        <section class="journal" aria-live="polite">
          <h2 id="journal-title">Travel Journal</h2>
          <p id="journal-text"></p>
          <p id="creature-text"></p>
          <strong id="status-text"></strong>
        </section>
        <section class="legend">
          <h2>Map Legend</h2>
          <div class="legend-list">
            <span><i class="swatch" style="background:#2f6f8f"></i>Sea</span>
            <span><i class="swatch" style="background:#e8c982"></i>Coast</span>
            <span><i class="swatch" style="background:#9fc96b"></i>Plains</span>
            <span><i class="swatch" style="background:#4f9a5a"></i>Forest</span>
            <span><i class="swatch" style="background:#6fb7a8"></i>Wetland</span>
            <span><i class="swatch" style="background:#b89b58"></i>Hills</span>
            <span><i class="swatch" style="background:#8d8796"></i>Mountains</span>
            <span><i class="swatch" style="background:#d9a95f"></i>Desert</span>
            <span><i class="swatch" style="background:#4fa3d9"></i>River</span>
            <span><i class="swatch" style="background:#c46b4f"></i>Settlement</span>
          </div>
        </section>
      </aside>
    </main>
    <script src="generator.js"></script>
    <script src="journal.js"></script>
    <script src="main.js"></script>
  </body>
</html>
