# Deploys the playable demo to GitHub Pages.
#
# This replaces the old npm-publish workflow, which could not succeed (it ran `npm publish` on a
# private package) and targeted a package registry — the wrong destination for a game. The build
# output here is plain static files, so the same `dist/` can later be uploaded to Hostinger or any
# other static host without changing anything but `DEPLOY_BASE`.

name: Deploy to Pages

# This is the *only* workflow that should deploy Pages.
#
# Turning Pages on in the repository settings makes GitHub offer to commit a `jekyll-gh-pages.yml`
# alongside it. Do not accept: this is a Vite application, not a Jekyll site, and that workflow
# would publish the rendered README instead of the game — and then fight this one over the shared
# `pages` concurrency group.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # First, so a Pages misconfiguration costs five seconds rather than a full install, test and
      # build. This step 404s until Pages is switched on for the repository under
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions". The action's
      # `enablement: true` input can do that automatically, but only with a personal access token —
      # `GITHUB_TOKEN` is explicitly not accepted — so the one-time setting is the cheaper path.
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        # Pages serves the site from /<repo>/, so assets must resolve against that subpath.
        #
        # VITE_CANON_API is optional and safe to leave unset: the canon panel simply never
        # appears and the game makes no network calls, which is exactly how it shipped before
        # the service existed. Set it as a repository *variable* (Settings -> Secrets and
        # variables -> Actions -> Variables) to the Space URL to switch retrieval on.
        #
        # It must be a variable, never a secret, and it must never hold the canon API key:
        # Vite inlines every VITE_* value into the bundle, so anything here is readable by
        # every visitor. The published game gets retrieval only; generation stays gated
        # behind a key that lives on the service.
        run: npm run build
        env:
          DEPLOY_BASE: /${{ github.event.repository.name }}/
          VITE_CANON_API: ${{ vars.VITE_CANON_API }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
