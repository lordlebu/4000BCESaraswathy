# Deploys the playable demo to GitHub Pages.
#
# This replaces the old npm-publish workflow, which could not succeed (it ran `npm publish` on a
# private package) and targeted a package registry — the wrong destination for a game. The build
# output here is plain static files, so the same `dist/` can later be uploaded to Hostinger or any
# other static host without changing anything but `DEPLOY_BASE`.

name: Deploy to Pages

# PARKED — manual trigger only, on purpose.
#
# GitHub Pages has never been enabled for this repository, so `configure-pages` 404s and every push
# to main goes red. A workflow that always fails is worse than no workflow: it trains everyone to
# ignore the red X, and the next real failure gets ignored with it.
#
# To turn deployment back on:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. Run this workflow once from the Actions tab to confirm it deploys
#   3. Restore the push trigger below
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#
# The build itself is known good: the browser suite passes against a subpath build served at
# /4000BCESaraswathy/, which is exactly how Pages serves it. Only the Pages setting is missing.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # First, so a Pages misconfiguration costs five seconds rather than a full install, test and
      # build. This step 404s until Pages is switched on for the repository under
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions". The action's
      # `enablement: true` input can do that automatically, but only with a personal access token —
      # `GITHUB_TOKEN` is explicitly not accepted — so the one-time setting is the cheaper path.
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        # Pages serves the site from /<repo>/, so assets must resolve against that subpath.
        run: npm run build
        env:
          DEPLOY_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
