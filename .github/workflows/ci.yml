name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Catches what neither of the above can: two pull requests that are each green alone and break
  # something once they are both on `main`. Also the safety net for anything that only shows up
  # on a quiet runner.
  schedule:
    - cron: '0 3 * * *'

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # The generated data files are a projection of the species canon in the SouthOfTethys
      # repo, which is not in this checkout — so CI cannot rebuild them to compare. They are
      # checked against data/canon.lock.json instead, which catches a hand-edit to a generated
      # file or a half-applied export.
      - name: Canon data matches the lock
        run: npm run check:data

  # Is there any code in this change?
  #
  # Its own job rather than a step inside the browser job, because there are four browser jobs now
  # and the answer is the same for all of them. It is also the only one that needs the full history
  # the comparison below reads, so the shards get the fast shallow clone.
  browser-scope:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The comparison below needs history, which the default shallow clone does not have.
          fetch-depth: 0
      - id: scope
        run: |
          # A push to main re-verifies everything: it is the branch that gets deployed, and
          # being wrong there is expensive in a way that saving four minutes is not.
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "on main — running the full suite"
            exit 0
          fi
          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          # Everything counts as code except an explicit safe list, and the list is short on
          # purpose: an ambiguous case should err towards checking, and an empty diff lands here
          # and runs the suite for the same reason. Workflow files are deliberately *not* safe --
          # a change to how CI runs should be checked by CI.
          #
          # What is safe, and why each one cannot reach the browser:
          #
          #   *.md            prose.
          #   docs/**         prose and the images embedded in it. Nothing under src/ or tools/
          #                   reads anything in docs/ -- checked, not assumed.
          #   assets/source/  the raw art the sheet builders read. Changing one of these does not
          #                   change a pixel the game draws: it changes an *input*, and the built
          #                   sheet under assets/ only moves when somebody runs the tool and
          #                   commits the output -- which is itself a change to assets/, and that
          #                   is not on this list.
          #
          # `assets/*.png` and `src/ui/plates/*.png` are pointedly absent. Those are imported by
          # `src/` and ship in the bundle, so a change to one changes what renders, and two specs
          # compare rendered frames. An art change that cannot break a test is still an art change
          # that can break a screenshot.
          if echo "$changed" | grep -qvE '(^docs/|^assets/source/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation only — skipping the browser suite"
          fi

  # The unit suite runs under Node and cannot see the canvas. These jobs are the only thing that
  # proves Phaser still boots and draws — worth their own runners given how new Phaser 4 is.
  #
  # **Four shards, because the suite outgrew one runner and the margin was gone before anybody
  # noticed.** This job used to be a single runner with `timeout-minutes: 30`, sized by a comment
  # that assumed "the suite takes its usual 4 or 5" minutes. Measured in September 2026, in
  # `mcr.microsoft.com/playwright` at a hosted runner's exact size — 4 CPUs, 16 GB, SwiftShader —
  # the 129 tests are **45 CPU-minutes of work**, which two workers finish in **22.5 minutes**.
  # Against a 30-minute cap that is not a margin, it is a coin toss: six runs of the identical
  # suite on `main` measured 17.3, 21.9, 22.1, 28.6, 29.3 and 29.3 minutes, and run 35345668203
  # went over and was killed with 49 tests unreported.
  #
  # Nothing was wrong with the tests. Nothing was skipped to fix it, and nothing is run anywhere
  # it was not run before — the work is simply spread across four runners, which is what this
  # file's own comment said to do when the suite got slow: *split it by time, shard the suite, so
  # no test is left running only where nobody can act on it.* Modelled against the measured
  # per-file durations the worst shard is **8.2 minutes**, and it is the worst shard that decides
  # whether this job goes red.
  #
  # Playwright balances a shard by test *count* rather than by duration, so the four are uneven —
  # 2.7 to 8.2 minutes. That is fine and is not worth hand-tuning: the point of the change is
  # headroom, and the slowest shard already has 21 minutes of it.
  browser-shard:
    needs: browser-scope
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports. One shard failing must not cancel the other three, because which
      # tests the others were about to run is exactly what you want to know while reading the
      # failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Has to clear the two install steps retrying *and* the suite still running afterwards.
    # Worked through: deps can spend 12 and the download 15, but a run where both burn their
    # full budget is already broken. The case to leave room for is the realistic one -- deps
    # stalls twice and succeeds on the third attempt, about 14 minutes, then a shard takes its
    # measured 8. That is the number this cap is now sized against, and it fits with room.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.browser-scope.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.browser-scope.outputs.code == 'true'

      # Chromium was downloaded on every run, which is about a minute of a job that is already
      # the slowest thing in CI. The key carries the Playwright version, so a bump misses the
      # cache and fetches the matching browser rather than reusing a stale one.
      #
      # Read from the lockfile via the installed package, which is the version that will
      # actually run. `package.json` says `^1.62.1`, so reading the range there would keep one
      # key across several real browser versions and serve a stale binary.
      - name: Playwright version
        id: pw
        if: needs.browser-scope.outputs.code == 'true'
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        if: needs.browser-scope.outputs.code == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
          # A miss on the exact version still restores the previous one. The installer then
          # fetches only what is genuinely missing rather than starting from an empty
          # directory, which is the difference between a short download and the long one
          # that hangs.
          restore-keys: |
            playwright-${{ runner.os }}-

      # The OS packages the browser needs. Not cached -- they go into system directories rather
      # than `~/.cache/ms-playwright` -- so this runs every time.
      #
      # **This step was described as "cheap enough to install either way" and that was wrong.**
      # It is `apt-get update` plus about forty packages from Azure's Ubuntu mirrors, which is
      # two to four minutes on a cold runner and occasionally much worse when a mirror is slow.
      # A 5-minute bound cut into normal variance rather than catching a hang, and run
      # 32227114349 died at exactly 5:00 with the install still in progress.
      #
      # So it gets the same treatment as the download below, for the same reason: it is a
      # network operation that can stall. 12 minutes outside, 5 per attempt inside, three
      # attempts. The inner bound is what makes retrying worth anything -- without it one stalled
      # attempt eats the whole budget.
      #
      # `apt-get update` is retried on its own first. A stale package index is the usual cause of
      # the install failing outright, and refreshing it is far cheaper than re-fetching forty
      # packages.
      - name: Install Chromium's system dependencies
        if: needs.browser-scope.outputs.code == 'true'
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            echo "::group::System dependencies, attempt $attempt of 3"
            sudo apt-get update -qq || echo "apt-get update failed; trying the install anyway"
            if timeout 300 npx playwright install-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed or timed out"
            sleep $((attempt * 15))
          done
          echo "::error::Chromium's system dependencies would not install after three attempts"
          exit 1

      # The browser itself, and the step that hangs.
      #
      # Observed: a run sat on this for twenty minutes and had to be cancelled by hand. It is a
      # ~170 MB download from Playwright's CDN, and when that connection stalls the installer
      # waits rather than failing -- so with no timeout the job ran towards the six-hour default
      # instead of failing in a minute and being retryable.
      #
      # Three things together, because no one of them is sufficient:
      #
      #   * `timeout-minutes` turns an indefinite hang into a failure in bounded time. This is
      #     the part that matters -- a hang you can retry costs a minute, a hang you cannot
      #     costs the afternoon.
      #   * the retry loop covers a stall that is genuinely transient, which is most of them,
      #     without a human having to notice and press the button.
      #   * `timeout 240` inside the loop bounds each *attempt*. Without it the first attempt
      #     could consume the whole step budget and the retries would never run.
      #
      # A cache hit skips the download entirely, so on most runs this does nothing at all.
      - name: Install Chromium
        if: needs.browser-scope.outputs.code == 'true'
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            echo "::group::Chromium download, attempt $attempt of 3"
            if timeout 240 npx playwright install chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed or timed out"
            sleep $((attempt * 10))
          done
          echo "::error::Chromium would not install after three attempts"
          exit 1

      # **Everything runs everywhere, including the walk.**
      #
      # This used to hold the walk back from pull requests, on the reasoning that it was "four and
      # a half minutes of a job that was seventeen -- for a test that failed four times running on
      # causes unrelated to the change under review". Both halves of that have since stopped being
      # true, and keeping the split was costing more than it saved.
      #
      # The failures were not unrelated. The walk was pacing three tiles for seventy legs and
      # running out of budget, because its stuck-detector could only see a traveller frozen on one
      # tile and not one looping between several. Fixed in `playthrough.spec.ts`.
      #
      # What the split did cost was real: `@slow` on `main` only means the walk first runs **after
      # the merge**, so a pull request goes green, merges, and turns `main` red. That happened
      # three times in one sprint. A check that only fails once it is too late to act cheaply is
      # worse than a slightly slower one.
      #
      # **The walk is still the single most expensive test and its budget is worth watching.**
      # Measured at a runner's size it takes 134 seconds against `playwright.config.ts`'s
      # 180-second per-test timeout -- comfortable but not generous, and the config's own note
      # calling it "about a minute" is the stale number that let this creep past unread.
      - name: Browser suite
        if: needs.browser-scope.outputs.code == 'true'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure() && needs.browser-scope.outputs.code == 'true'
        with:
          # Unique per shard: upload-artifact refuses to write the same name twice in one run.
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The required status check, and the only reason this job exists.
  #
  # `main`'s ruleset requires a check named `browser`, and a matrix reports as `browser-shard (1)`
  # and so on -- four names that did not exist yesterday and that the ruleset cannot be taught
  # without somebody editing repository settings every time the shard count changes. This gate
  # keeps the name the rule already asks for.
  #
  # `if: always()` for the reason the scope step was written the way it was: **a required check
  # that does not report leaves a pull request pending for ever rather than failing it**, which is
  # worse than a red one. So it runs whatever the shards did, and reads their aggregate result --
  # `needs.browser-shard.result` is `success` only when every shard succeeded.
  browser:
    needs: browser-shard
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.browser-shard.result }}"
          [ "${{ needs.browser-shard.result }}" = "success" ] || {
            echo "::error::at least one browser shard did not pass"
            exit 1
          }
