name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Catches what neither of the above can: two pull requests that are each green alone and break
  # something once they are both on `main`. Also the safety net for the full map crossing, which a
  # pull request no longer runs -- see the browser job.
  schedule:
    - cron: '0 3 * * *'

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # The generated data files are a projection of the species canon in the SouthOfTethys
      # repo, which is not in this checkout — so CI cannot rebuild them to compare. They are
      # checked against data/canon.lock.json instead, which catches a hand-edit to a generated
      # file or a half-applied export.
      - name: Canon data matches the lock
        run: npm run check:data

  # The unit suite runs under Node and cannot see the canvas. This job is the only thing that
  # proves Phaser still boots and draws — worth its own runner given how new Phaser 4 is.
  browser:
    runs-on: ubuntu-latest
    # Has to clear the two install steps retrying *and* the suite still running afterwards.
    # Worked through: deps can spend 12 and the download 15, but a run where both burn their
    # full budget is already broken. The case to leave room for is the realistic one -- deps
    # stalls twice and succeeds on the third attempt, about 14 minutes, then the suite takes
    # its usual 4 or 5. At 20 that lands on the cap and the job is killed mid-suite with no
    # report, which is the least useful failure available.
    timeout-minutes: 30
    steps:
      # Deliberately not `paths-ignore` on the workflow, and not `if:` on the job.
      #
      # Both of those stop the check *reporting*, and a required status check that never
      # reports leaves a pull request pending forever rather than mergeable. `main` is
      # protected here, so a docs PR that could not merge would be a worse problem than a
      # five-minute suite. The job therefore always runs and always goes green; it just does
      # almost nothing when there is no code in the change.
      - uses: actions/checkout@v7
        with:
          # The comparison below needs history, which the default shallow clone does not have.
          fetch-depth: 0

      - name: Is there any code in this change?
        id: scope
        run: |
          # A push to main re-verifies everything: it is the branch that gets deployed, and
          # being wrong there is expensive in a way that saving four minutes is not.
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "on main — running the full suite"
            exit 0
          fi
          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          # Everything counts as code except an explicit safe list, and the list is short on
          # purpose: an ambiguous case should err towards checking, and an empty diff lands here
          # and runs the suite for the same reason. Workflow files are deliberately *not* safe --
          # a change to how CI runs should be checked by CI.
          #
          # What is safe, and why each one cannot reach the browser:
          #
          #   *.md            prose.
          #   docs/**         prose and the images embedded in it. Nothing under src/ or tools/
          #                   reads anything in docs/ -- checked, not assumed.
          #   assets/source/  the raw art the sheet builders read. Changing one of these does not
          #                   change a pixel the game draws: it changes an *input*, and the built
          #                   sheet under assets/ only moves when somebody runs the tool and
          #                   commits the output -- which is itself a change to assets/, and that
          #                   is not on this list.
          #
          # `assets/*.png` and `src/ui/plates/*.png` are pointedly absent. Those are imported by
          # `src/` and ship in the bundle, so a change to one changes what renders, and two specs
          # compare rendered frames. An art change that cannot break a test is still an art change
          # that can break a screenshot.
          if echo "$changed" | grep -qvE '(^docs/|^assets/source/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation only — skipping the browser suite"
          fi

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.code == 'true'

      # Chromium was downloaded on every run, which is about a minute of a job that is already
      # the slowest thing in CI. The key carries the Playwright version, so a bump misses the
      # cache and fetches the matching browser rather than reusing a stale one.
      #
      # Read from the lockfile via the installed package, which is the version that will
      # actually run. `package.json` says `^1.62.1`, so reading the range there would keep one
      # key across several real browser versions and serve a stale binary.
      - name: Playwright version
        id: pw
        if: steps.scope.outputs.code == 'true'
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        if: steps.scope.outputs.code == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
          # A miss on the exact version still restores the previous one. The installer then
          # fetches only what is genuinely missing rather than starting from an empty
          # directory, which is the difference between a short download and the long one
          # that hangs.
          restore-keys: |
            playwright-${{ runner.os }}-

      # The OS packages the browser needs. Not cached -- they go into system directories rather
      # than `~/.cache/ms-playwright` -- so this runs every time.
      #
      # **This step was described as "cheap enough to install either way" and that was wrong.**
      # It is `apt-get update` plus about forty packages from Azure's Ubuntu mirrors, which is
      # two to four minutes on a cold runner and occasionally much worse when a mirror is slow.
      # A 5-minute bound cut into normal variance rather than catching a hang, and run
      # 32227114349 died at exactly 5:00 with the install still in progress.
      #
      # So it gets the same treatment as the download below, for the same reason: it is a
      # network operation that can stall. 12 minutes outside, 5 per attempt inside, three
      # attempts. The inner bound is what makes retrying worth anything -- without it one stalled
      # attempt eats the whole budget.
      #
      # `apt-get update` is retried on its own first. A stale package index is the usual cause of
      # the install failing outright, and refreshing it is far cheaper than re-fetching forty
      # packages.
      - name: Install Chromium's system dependencies
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            echo "::group::System dependencies, attempt $attempt of 3"
            sudo apt-get update -qq || echo "apt-get update failed; trying the install anyway"
            if timeout 300 npx playwright install-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed or timed out"
            sleep $((attempt * 15))
          done
          echo "::error::Chromium's system dependencies would not install after three attempts"
          exit 1

      # The browser itself, and the step that hangs.
      #
      # Observed: a run sat on this for twenty minutes and had to be cancelled by hand. It is a
      # ~170 MB download from Playwright's CDN, and when that connection stalls the installer
      # waits rather than failing -- so with no timeout the job ran towards the six-hour default
      # instead of failing in a minute and being retryable.
      #
      # Three things together, because no one of them is sufficient:
      #
      #   * `timeout-minutes` turns an indefinite hang into a failure in bounded time. This is
      #     the part that matters -- a hang you can retry costs a minute, a hang you cannot
      #     costs the afternoon.
      #   * the retry loop covers a stall that is genuinely transient, which is most of them,
      #     without a human having to notice and press the button.
      #   * `timeout 240` inside the loop bounds each *attempt*. Without it the first attempt
      #     could consume the whole step budget and the retries would never run.
      #
      # A cache hit skips the download entirely, so on most runs this does nothing at all.
      - name: Install Chromium
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            echo "::group::Chromium download, attempt $attempt of 3"
            if timeout 240 npx playwright install chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed or timed out"
            sleep $((attempt * 10))
          done
          echo "::error::Chromium would not install after three attempts"
          exit 1

      # The full map crossing runs on `main` and on the nightly schedule; a pull request gets
      # everything else.
      #
      # `main` is what gets deployed and is worth the whole suite. A pull request is worth a fast
      # answer, and the walk is four and a half minutes of a job that was seventeen -- for a test
      # that failed four times running on causes unrelated to the change under review. A check that
      # is usually red for reasons you did not cause is a check people learn to ignore, which is
      # worse than not having it.
      #
      # Nothing is skipped, only moved: the walk still guards every merge, and a nightly run catches
      # the case where two green pull requests break it only once they are together.
      - name: Browser suite
        if: steps.scope.outputs.code == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "on ${{ github.ref_name }} -- running the whole suite, walk included"
            npm run test:e2e
          else
            echo "pull request -- running everything but the full map crossing (@slow)"
            npm run test:e2e:fast
          fi
      - uses: actions/upload-artifact@v7
        if: failure() && steps.scope.outputs.code == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
