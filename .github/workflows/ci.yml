name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # The generated data files are built from docs/bestiary.md. If regenerating them changes
      # anything, the committed copies are stale and the journal is out of step with the prose.
      - name: Species data is up to date
        run: |
          npm run build:data
          git diff --exit-code data/

  # The unit suite runs under Node and cannot see the canvas. This job is the only thing that
  # proves Phaser still boots and draws — worth its own runner given how new Phaser 4 is.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
