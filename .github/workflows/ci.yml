name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # The generated data files are a projection of the species canon in the SouthOfTethys
      # repo, which is not in this checkout — so CI cannot rebuild them to compare. They are
      # checked against data/canon.lock.json instead, which catches a hand-edit to a generated
      # file or a half-applied export.
      - name: Canon data matches the lock
        run: npm run check:data

  # The unit suite runs under Node and cannot see the canvas. This job is the only thing that
  # proves Phaser still boots and draws — worth its own runner given how new Phaser 4 is.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Deliberately not `paths-ignore` on the workflow, and not `if:` on the job.
      #
      # Both of those stop the check *reporting*, and a required status check that never
      # reports leaves a pull request pending forever rather than mergeable. `main` is
      # protected here, so a docs PR that could not merge would be a worse problem than a
      # five-minute suite. The job therefore always runs and always goes green; it just does
      # almost nothing when there is no code in the change.
      - uses: actions/checkout@v7
        with:
          # The comparison below needs history, which the default shallow clone does not have.
          fetch-depth: 0

      - name: Is there any code in this change?
        id: scope
        run: |
          # A push to main re-verifies everything: it is the branch that gets deployed, and
          # being wrong there is expensive in a way that saving four minutes is not.
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "on main — running the full suite"
            exit 0
          fi
          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          # Anything that is not markdown counts as code, including workflow files — a change
          # to how CI runs should be checked by CI. An empty diff also lands here and runs the
          # suite, which is deliberate: every ambiguous case should err towards checking.
          if echo "$changed" | grep -qvE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation only — skipping the browser suite"
          fi

      - uses: actions/setup-node@v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.code == 'true'

      # Chromium was downloaded on every run, which is about a minute of a job that is already
      # the slowest thing in CI. The key carries the Playwright version, so a bump misses the
      # cache and fetches the matching browser rather than reusing a stale one.
      #
      # Read from the lockfile via the installed package, which is the version that will
      # actually run. `package.json` says `^1.62.1`, so reading the range there would keep one
      # key across several real browser versions and serve a stale binary.
      - name: Playwright version
        id: pw
        if: steps.scope.outputs.code == 'true'
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        if: steps.scope.outputs.code == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
          # A miss on the exact version still restores the previous one. The installer then
          # fetches only what is genuinely missing rather than starting from an empty
          # directory, which is the difference between a short download and the long one
          # that hangs.
          restore-keys: |
            playwright-${{ runner.os }}-

      # The OS packages the browser needs. These are not cached -- they go into system
      # directories rather than `~/.cache/ms-playwright` -- and are cheap, so they run every
      # time. Split from the browser download below because only the download hangs, and
      # retrying an apt install that already succeeded is wasted minutes.
      - name: Install Chromium's system dependencies
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      # The browser itself, and the step that hangs.
      #
      # Observed: a run sat on this for twenty minutes and had to be cancelled by hand. It is a
      # ~170 MB download from Playwright's CDN, and when that connection stalls the installer
      # waits rather than failing -- so with no timeout the job ran towards the six-hour default
      # instead of failing in a minute and being retryable.
      #
      # Three things together, because no one of them is sufficient:
      #
      #   * `timeout-minutes` turns an indefinite hang into a failure in bounded time. This is
      #     the part that matters -- a hang you can retry costs a minute, a hang you cannot
      #     costs the afternoon.
      #   * the retry loop covers a stall that is genuinely transient, which is most of them,
      #     without a human having to notice and press the button.
      #   * `timeout 240` inside the loop bounds each *attempt*. Without it the first attempt
      #     could consume the whole step budget and the retries would never run.
      #
      # A cache hit skips the download entirely, so on most runs this does nothing at all.
      - name: Install Chromium
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            echo "::group::Chromium download, attempt $attempt of 3"
            if timeout 240 npx playwright install chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed or timed out"
            sleep $((attempt * 10))
          done
          echo "::error::Chromium would not install after three attempts"
          exit 1

      - run: npm run test:e2e
        if: steps.scope.outputs.code == 'true'
      - uses: actions/upload-artifact@v7
        if: failure() && steps.scope.outputs.code == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
