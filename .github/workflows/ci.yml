name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Catches what neither of the above can: two pull requests that are each green alone and break
  # something once they are both on `main`. Also the safety net for anything that only shows up
  # on a quiet runner.
  schedule:
    - cron: '0 3 * * *'

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # The app's own chunk against a budget. Canon's bundle is budgeted in the canon repo, but that
      # gate sees only canon's files; this sees everything Vite put in the page. See the tool.
      - name: App chunk inside its budget
        run: npm run check:size
      # The generated data files are a projection of the species canon in the SouthOfTethys
      # repo, which is not in this checkout — so CI cannot rebuild them to compare. They are
      # checked against data/canon.lock.json instead, which catches a hand-edit to a generated
      # file or a half-applied export.
      - name: Canon data matches the lock
        run: npm run check:data

  # Is there any code in this change?
  #
  # Its own job rather than a step inside the browser job, because there are four browser jobs now
  # and the answer is the same for all of them. It is also the only one that needs the full history
  # the comparison below reads, so the shards get the fast shallow clone.
  browser-scope:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      # The Playwright the lockfile pins, which picks the shards' container image. Read from the
      # lockfile rather than written here, the way `tools/ci-local.sh` reads it, so a bump cannot
      # leave CI driving a different Chromium from the one the tests were written against.
      playwright: ${{ steps.pw.outputs.v }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The comparison below needs history, which the default shallow clone does not have.
          fetch-depth: 0
      - id: pw
        run: echo "v=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - id: scope
        run: |
          # A push to main re-verifies everything: it is the branch that gets deployed, and
          # being wrong there is expensive in a way that saving four minutes is not.
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "on main — running the full suite"
            exit 0
          fi
          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          # Everything counts as code except an explicit safe list, and the list is short on
          # purpose: an ambiguous case should err towards checking, and an empty diff lands here
          # and runs the suite for the same reason. Workflow files are deliberately *not* safe --
          # a change to how CI runs should be checked by CI.
          #
          # What is safe, and why each one cannot reach the browser:
          #
          #   *.md            prose.
          #   docs/**         prose and the images embedded in it. Nothing under src/ or tools/
          #                   reads anything in docs/ -- checked, not assumed.
          #   assets/source/  the raw art the sheet builders read. Changing one of these does not
          #                   change a pixel the game draws: it changes an *input*, and the built
          #                   sheet under assets/ only moves when somebody runs the tool and
          #                   commits the output -- which is itself a change to assets/, and that
          #                   is not on this list.
          #
          # `assets/*.png` and `src/ui/plates/*.png` are pointedly absent. Those are imported by
          # `src/` and ship in the bundle, so a change to one changes what renders, and two specs
          # compare rendered frames. An art change that cannot break a test is still an art change
          # that can break a screenshot.
          if echo "$changed" | grep -qvE '(^docs/|^assets/source/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation only — skipping the browser suite"
          fi

  # The unit suite runs under Node and cannot see the canvas. These jobs are the only thing that
  # proves Phaser still boots and draws — worth their own runners given how new Phaser 4 is.
  #
  # **Four shards, because the suite outgrew one runner and the margin was gone before anybody
  # noticed.** This job used to be a single runner with `timeout-minutes: 30`, sized by a comment
  # that assumed "the suite takes its usual 4 or 5" minutes. Measured in September 2026, at a
  # hosted runner's size — 4 CPUs, 16 GB, SwiftShader — the 129 tests are **45 CPU-minutes of
  # work**, which two workers finish in **22.5 minutes**. Against a 30-minute cap that is not a
  # margin, it is a coin toss: six runs of the identical suite on `main` measured 17.3, 21.9,
  # 22.1, 28.6, 29.3 and 29.3 minutes, and run 35345668203 went over and was killed with 49 tests
  # unreported.
  #
  # Nothing was wrong with the tests. Nothing was skipped to fix it, and nothing runs anywhere it
  # did not run before — the work is spread across four runners, which is what this file's own
  # comment said to do when the suite got slow: *split it by time, shard the suite, so no test is
  # left running only where nobody can act on it.*
  #
  # **Measured on CI, twice, and the pair is the point:**
  #
  #                      shard 1   shard 2   shard 3   shard 4
  #     35354275483        6.6       6.1      16.7       4.4     one flaky walk
  #     35366992526        6.6       6.1       6.7       3.6     clean
  #
  # A clean run is **6.7 minutes at worst and evenly balanced**. The 16.7 was not the shard: the
  # map crossing blew its own 480-second budget and `retries: 1` re-ran it, which is ten minutes
  # on one shard. The second run confirms that rather than leaving it inferred.
  #
  # **The cap below is sized against 16.7 and not against 6.7 on purpose**, because the flaky
  # case is the one that actually happens and the one a cap exists for.
  #
  # The walk's budget is recorded rather than tuned -- see `docs/testing.md` and the rule there
  # about measuring a signal before moving a threshold. Two runs is not yet a signal.
  #
  # Raising the shard count is unnecessary and barely works anyway, which is worth knowing before
  # somebody tries it: modelled on the per-file durations, at six the worst shard is 16.3 minutes
  # and at eight 11.6, because a handful of files dominate -- `reachable.spec.ts` is 6.6 minutes
  # by itself -- and a file cannot be split across shards.
  browser-shard:
    needs: browser-scope
    runs-on: ubuntu-latest
    # **Inside Playwright's own image, with Chromium and every package it needs already in it.**
    # The shards used to install about forty Ubuntu packages from Azure's mirror and download a
    # ~170 MB browser on every run, each behind a retry loop and its own time budget. Both kept
    # failing anyway: on 1 October 2026 two of four shards on `main` (run 36905929698) and three on
    # a pull request died at "Install Chromium's system dependencies" after three attempts, before a
    # single test ran, while the same code passed every shard an hour earlier. A step that is not
    # there cannot fail. The image is what `tools/ci-local.sh` already runs: the same Ubuntu, the
    # same headless Chromium and the same software renderer, so nothing the tests see changes.
    # `--ipc=host` because Chromium in a container runs out of shared memory without it.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.browser-scope.outputs.playwright }}-noble
      options: --ipc=host
    strategy:
      # Every shard reports. One shard failing must not cancel the other three, because which
      # tests the others were about to run is exactly what you want to know while reading the
      # failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # **Sized from the slowest measured shard plus the image, and not from a hope.** The slowest
    # shard measured 16.7 minutes -- the run with the flaky walk in it, deliberately, because a cap
    # is for the bad run and not the good one -- and pulling the image is a minute or two. It was 45
    # while two install steps could spend 27 minutes between them; those steps are gone (see
    # `container` above), so 30 bounds the worst honest run with room to spare.
    #
    # The old 30 was the number that broke: it was chosen when the suite was believed to take
    # four or five minutes, and it stopped bounding a hang and started deciding runs. A cap is
    # only a backstop here -- Playwright's own 180-second per-test timeout is what actually
    # bounds a hung test -- so it should be comfortably above the worst honest run rather than
    # near it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: needs.browser-scope.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.browser-scope.outputs.code == 'true'

      # **Everything runs everywhere, including the walk.**
      #
      # This used to hold the walk back from pull requests, on the reasoning that it was "four and
      # a half minutes of a job that was seventeen -- for a test that failed four times running on
      # causes unrelated to the change under review". Both halves of that have since stopped being
      # true, and keeping the split was costing more than it saved.
      #
      # The failures were not unrelated. The walk was pacing three tiles for seventy legs and
      # running out of budget, because its stuck-detector could only see a traveller frozen on one
      # tile and not one looping between several. Fixed in `playthrough.spec.ts`.
      #
      # What the split did cost was real: `@slow` on `main` only means the walk first runs **after
      # the merge**, so a pull request goes green, merges, and turns `main` red. That happened
      # three times in one sprint. A check that only fails once it is too late to act cheaply is
      # worse than a slightly slower one.
      #
      # **The walk is still the single most expensive test and its budget is worth watching.**
      # Measured at a runner's size it takes 134 seconds against `playwright.config.ts`'s
      # 180-second per-test timeout -- comfortable but not generous, and the config's own note
      # calling it "about a minute" is the stale number that let this creep past unread.
      - name: Browser suite
        if: needs.browser-scope.outputs.code == 'true'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      # **Uploaded whenever the suite ran, not only when the job failed.** `trace: 'on-first-retry'`
      # captures exactly what a diagnosis needs, and a flaky test is one that *passed* on the
      # retry -- so under `if: failure()` the job goes green and throws the trace away. That is
      # how shard 3's 480-second walk timeout on run 35354275483 left nothing to read. It is the
      # same shape as the fault `playwright.config.ts` already records, where `github` alone wrote
      # no files and every failed run uploaded an empty artifact.
      #
      # It costs about 230 KB per shard on a green run -- the report shell, since a trace is only
      # written on a retry and a screenshot only on a failure -- so under a megabyte a run, held
      # for seven days.
      - uses: actions/upload-artifact@v7
        if: '!cancelled() && needs.browser-scope.outputs.code == ''true'''
        with:
          # Unique per shard: upload-artifact refuses to write the same name twice in one run.
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The required status check, and the only reason this job exists.
  #
  # `main`'s ruleset requires a check named `browser`, and a matrix reports as `browser-shard (1)`
  # and so on -- four names that did not exist yesterday and that the ruleset cannot be taught
  # without somebody editing repository settings every time the shard count changes. This gate
  # keeps the name the rule already asks for.
  #
  # `if: always()` for the reason the scope step was written the way it was: **a required check
  # that does not report leaves a pull request pending for ever rather than failing it**, which is
  # worse than a red one. So it runs whatever the shards did, and reads their aggregate result --
  # `needs.browser-shard.result` is `success` only when every shard succeeded.
  browser:
    needs: browser-shard
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.browser-shard.result }}"
          [ "${{ needs.browser-shard.result }}" = "success" ] || {
            echo "::error::at least one browser shard did not pass"
            exit 1
          }
