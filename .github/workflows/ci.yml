name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # The generated data files are a projection of the species canon in the SouthOfTethys
      # repo, which is not in this checkout — so CI cannot rebuild them to compare. They are
      # checked against data/canon.lock.json instead, which catches a hand-edit to a generated
      # file or a half-applied export.
      - name: Canon data matches the lock
        run: npm run check:data

  # The unit suite runs under Node and cannot see the canvas. This job is the only thing that
  # proves Phaser still boots and draws — worth its own runner given how new Phaser 4 is.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
